 const FF=[['comm',/comment|remark|note|feedback/],['conn',/connect|reach|picked|answer/],['sub',/sub.?status|disposition|dispo|outcome|status|result/],['camp',/campaign|process|program|source/],['agent',/agent|caller|executive|counsel|employee|\bby\b/],['date',/date|time|\bon\b/]];

 EX=HDR.map((h,i)=>i).filter(i=>!used.has(i));L=[];AT=[];
 t.slice(hr+1).filter(r=>r.some(c=>String(c).trim())).forEach((r,i)=>{const g=k=>idx[k]==null?'':(r[idx[k]]||'').trim(),ph=g('phone').replace(/\D/g,'').slice(-10);

function buildF(){const sel=(id,lab)=>{const o=OPT[id];if(!o||(id[0]=='x'&&o.size>60))return'';return`<label>${esc(lab)}<select data-id="${id}"><option value="">All</option>${[...o].sort((a,b)=>String(a[1]).localeCompare(String(b[1]),undefined,{numeric:true})).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('')}</select></label>`};

  document.querySelectorAll('[data-ma]').forEach(x=>{if(x.value!==''){const[n,f]=x.dataset.ma.split('|');(M.att[n]=M.att[n]||{})[f]=V(x.value)}});MAP=M;try{localStorage.setItem('map',JSON.stringify(M))}catch(e){}
  $('#modal').style.display='none';F={};load('',0,LASTT);}};
function lead(l){const m=$('#modal');m.innerHTML=`<div><button class=g style="float:right" id=cl>✕</button><h2 style="margin:0">${esc(l.name||'Unnamed lead')}</h2><p class=mu>📞 ${esc(l.phone||'–')} · ✉ ${esc(l.email||'–')}<br>📍 ${esc([l.city,l.state].filter(Boolean).join(', ')||'–')} · Lead generated: ${esc(l.ld||'–')}</p><h3>Calling timeline</h3>${l.at.map(a=>`<div class="tl ${a.conn===1?'c':a.conn===0?'n':''}"><b>Attempt ${a.n}</b> · ${esc(a.date||'no date')}<br>Agent: ${esc(a.agent||'–')} · Campaign: ${esc(a.camp||'–')}<br>Status: ${esc(a.sub||'–')} · <b>${a.conn===1?'Connected':a.conn===0?'Not Connected':'–'}</b><br><span class=mu>${esc(a.comm||'No comments')}</span></div>`).join('')||'<p class=mu>Never called</p>'}${EX.length?`<h3>Additional fields</h3>${EX.map(j=>`<div><span class=mu>${esc(HDR[j])}:</span> ${esc(l.r[j]||'–')}</div>`).join('')}`:''}</div>`;m.style.display='grid';$('#cl').onclick=()=>m.style.display='none'}
$('#modal').onclick=e=>{if(e.target.id=='modal')e.target.style.display='none'};
async function exp(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',csv=[HDR,...V.map(v=>v.l.r)].map(r=>HDR.map((h,i)=>q(r[i])).join(',')).join('\n');
 try{const d=window.claude&&await claude.use('downloads');if(!d)throw 0;await d.save({filename:'calling-data-filtered.csv',data:csv})}catch(e){alert('Download is not available in this view.')}}
const API_URL='https://script.google.com/macros/s/AKfycbyxh_pxg24fjhAkYHfAwjYfC6JvlKLlKxnsgc5SnlnMYzjZzYjgbCT7wrbBSnsJ7_E/exec?token=Ada@2026'; // optional: paste your Apps Script Web App URL (with ?token=...) here instead of using the Connect button
let API=API_URL;if(!API)try{API=localStorage.getItem('api')||''}catch(e){}
const st=t=>{$('#st').textContent=t||''};
const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open('calldash',1);q.onupgradeneeded=()=>q.result.createObjectStore('d');q.onerror=()=>r(null);
 q.onsuccess=()=>{const tx=q.result.transaction('d',m=='get'?'readonly':'readwrite'),o=tx.objectStore('d'),x=m=='get'?o.get('rows'):o.put(v,'rows');x.onsuccess=()=>r(x.result||null);x.onerror=()=>r(null)}}catch(e){r(null)}});
async function jf(u,t=0){try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),120000);let j;try{j=await(await fetch(u,{cache:'no-store',signal:ac.signal})).json()}finally{clearTimeout(tm)}if(j.error)throw new Error(j.error);return j}catch(e){if(t<2&&!/Unauthorized/.test(e.message))return jf(u,t+1);throw e}}
async function fetchAll(){const base=API+(API.includes('?')?'&':'?'),PS=3000,f=await jf(base+'start=0&count='+PS),T=f.total,starts=[];
 for(let s=PS;s<T;s+=PS)starts.push(s);let done=f.rows.length,ix=0;const res=[];st('Loading '+done+' / '+T+' rows…');
 const w=async()=>{while(ix<starts.length){const i=ix++,j=await jf(base+'start='+starts[i]+'&count='+PS);res[i]=j.rows;done+=j.rows.length;st('Loading '+done+' / '+T+' rows…')}};
 await Promise.all([1,2,3,4,5,6].map(w));return{header:f.header,rows:f.rows.concat(...res)}}
function apply(d){const f=F,x=DF;load('',0,[d.header,...d.rows]);F=f;DF=x;buildF();sync();render()}
let busy=0;
async function pull(first){if(!API||busy)return;busy=1;
 try{if(first){const c=await Promise.race([idb('get'),new Promise(r=>setTimeout(()=>r(null),2500))]);if(c){apply(c);STAMP=new Date(c.ts).toLocaleString()+' (cached)';meta(1);st('Showing saved data · updating from sheet…')}}
  const d=await fetchAll();d.ts=Date.now();apply(d);st('');idb('put',d)}
 catch(e){st('⚠ Sheet connection failed: '+(e.message||e))}finally{busy=0}}
$('#rf').onclick=()=>{if(API)pull();else $('#cn').click()};
$('#cn').onclick=()=>{const u=prompt('Paste your Apps Script Web App URL (including ?token=...)',API);if(u){API=u.trim();try{localStorage.setItem('api',API)}catch(e){}pull()}};
if(API){meta(0);render();st('Connecting to your Calling File sheet…');pull(1);setInterval(()=>{if(!document.hidden)pull()},300000)}else{meta(0);render()}
</script></body></html>
